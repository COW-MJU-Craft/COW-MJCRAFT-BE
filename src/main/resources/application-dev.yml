spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

management:
  health:
    mail:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS}
  refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS}

admin:
  login-id: ${ADMIN_LOGIN_ID}
  password: ${ADMIN_PASSWORD}
  email: ${ADMIN_EMAIL:}

mail:
  from: ${MAIL_FROM}
  from-name: ${MAIL_FROM_NAME:CowMjuCraft}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL}
  order-view-path: ${APP_ORDER_VIEW_PATH}
  order-view-token-ttl-minutes: ${APP_ORDER_VIEW_TOKEN_TTL_MINUTES}
  # QUERY(기본): 메일 링크가 ?token=... — 액세스 로그·프록시 로그·Referer에 토큰이 남는다.
  # FRAGMENT: #token=... — fragment는 서버로 전송되지 않는다. 프런트엔드가 location.hash에서
  # 토큰을 읽도록 대응을 마친 뒤 전환한다.
  order-view-token-delivery: ${APP_ORDER_VIEW_TOKEN_DELIVERY:QUERY}
