spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

management:
  health:
    mail:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS}
  refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS}

admin:
  login-id: ${ADMIN_LOGIN_ID}
  password: ${ADMIN_PASSWORD}
  email: ${ADMIN_EMAIL:}

mail:
  from: ${MAIL_FROM}
  from-name: ${MAIL_FROM_NAME:CowMjuCraft}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL}
  order-view-path: ${APP_ORDER_VIEW_PATH}
  order-view-token-ttl-minutes: ${APP_ORDER_VIEW_TOKEN_TTL_MINUTES}
  # 이메일 인증 코드 해싱용 서버 비밀값. 절대 커밋하지 않는다.
  customer-code-pepper: ${APP_CUSTOMER_CODE_PEPPER}
  customer-code-ttl-minutes: ${APP_CUSTOMER_CODE_TTL_MINUTES:10}
  customer-code-resend-interval-seconds: ${APP_CUSTOMER_CODE_RESEND_INTERVAL_SECONDS:60}
  customer-code-daily-limit: ${APP_CUSTOMER_CODE_DAILY_LIMIT:10}
