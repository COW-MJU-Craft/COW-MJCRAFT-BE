name: CI

# push는 main·develop에만 건다. 작업 브랜치까지 걸면 PR마다 push CI와 PR CI가
# 중복 실행된다. deploy.yml / deploy-dev.yml이 이 워크플로우의 workflow_run에
# 물려 있으므로 두 브랜치는 반드시 남겨야 한다 — 빼면 배포가 트리거되지 않는다.
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Generate coverage report
        run: ./gradlew jacocoTestReport

      - name: Total coverage ratchet (후퇴 방지선)
        run: ./gradlew jacocoTestCoverageVerification

      - name: Diff coverage gate (변경 코드 70% 이상)
        if: github.event_name == 'pull_request'
        run: |
          # 버전을 고정한다. 미고정 시 매 실행마다 최신 diff-cover가 설치돼
          # 업스트림 변경만으로 게이트가 오작동할 수 있다.
          pip install diff-cover==10.5.1
          git fetch origin ${{ github.base_ref }}
          diff-cover build/reports/jacoco/test/jacocoTestReport.xml \
            --compare-branch origin/${{ github.base_ref }} \
            --src-roots src/main/java \
            --fail-under=70

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore

  migration-guard:
    # Flyway 마이그레이션 사각지대 방어 (CI 빈 DB로는 못 잡는 것들)
    #  1) 중복 버전 번호 감지 — 두 브랜치가 각자 같은 V번호를 추가한 경우
    #  2) 기존 마이그레이션 수정/삭제/이름변경 감지 — checksum mismatch로
    #     dev·prod validate가 터지지만, CI는 매번 빈 DB라 자체적으로 못 잡는다.
    #     신규 파일 추가(A)만 허용한다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 중복 마이그레이션 버전 감지
        run: |
          set -e
          dir=src/main/resources/db/migration
          # V{N}__ 파일에서 버전 번호만 뽑아 중복을 찾는다 (R__ 반복 마이그레이션 제외)
          dupes=$(ls "$dir"/V*.sql 2>/dev/null \
            | sed -E 's#.*/V([0-9]+)__.*#\1#' \
            | sort -n | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::중복된 Flyway 버전 번호가 있습니다: $dupes"
            echo "같은 V번호를 쓰는 파일을 재번호(rename)하세요."
            exit 1
          fi
          echo "OK — 중복 버전 없음"

      - name: 기존 마이그레이션 수정/삭제 감지
        if: github.event_name == 'pull_request'
        run: |
          set -e
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          # base 대비 이 PR이 건드린 마이그레이션 중 수정(M)·삭제(D)·이름변경(R)만 추출.
          # 이미 배포된 파일을 고치면 checksum mismatch가 나므로 신규 추가(A)만 허용한다.
          changed=$(git diff --name-status --diff-filter=MDR "$base"...HEAD \
            -- src/main/resources/db/migration/ || true)
          if [ -n "$changed" ]; then
            echo "::error::이미 병합된 마이그레이션을 수정/삭제/이름변경했습니다. 새 버전 파일을 추가하세요."
            echo "$changed"
            exit 1
          fi
          echo "OK — 기존 마이그레이션 변경 없음 (신규 추가만 있음)"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (시크릿 스캔)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml \
            --no-banner --redact --exit-code 1

  agent-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 에이전트 설정 구조 검증 (심링크/CLAUDE.md)
        run: |
          set -e
          test -d .agents/commands || { echo "::error::.agents/commands 없음"; exit 1; }
          test -L .claude/commands && test -e .claude/commands || { echo "::error::.claude/commands 심링크 깨짐"; exit 1; }
          test -L .codex/commands && test -e .codex/commands || { echo "::error::.codex/commands 심링크 깨짐"; exit 1; }
          grep -q "@AGENTS.md" CLAUDE.md || { echo "::error::CLAUDE.md에 @AGENTS.md import 없음"; exit 1; }
          echo "OK"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 검증 (push 없음)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
