name: Rollback (production)

# 운영을 이전 이미지로 되돌린다.
#
# Coolify가 :latest 태그를 바라보므로, Coolify 대시보드의 "이전 배포 Redeploy"는
# 같은 :latest를 다시 당겨올 뿐 롤백이 되지 않는다. 실제 롤백은 :latest가 가리키는
# 대상을 이전 SHA 이미지로 바꾸는 것이다. 이 워크플로우가 그 일을 한다.
#
# 절차·판단 기준·DB 제약은 docs/rollback.md 참조.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "되돌아갈 커밋 SHA (40자, GHCR 이미지 태그와 동일)"
        required: true
        type: string
      reason:
        description: "롤백 사유 (기록용)"
        required: true
        type: string

# deploy.yml과 같은 그룹을 써서 배포와 롤백이 동시에 진행되지 않게 한다.
# 롤백은 도중에 취소되면 안 되므로 cancel-in-progress를 끈다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  rollback:
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/cow-mju-craft/cowmjucraft

    steps:
      - name: 입력 SHA 형식 검증
        run: |
          if ! printf '%s' "${{ inputs.sha }}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::SHA는 소문자 16진수 40자여야 한다. 입력값: ${{ inputs.sha }}"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 대상 이미지 존재 확인
        run: |
          if ! docker buildx imagetools inspect "${IMAGE}:${{ inputs.sha }}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${{ inputs.sha }} 이미지가 GHCR에 없다. 배포된 적 없는 커밋이거나 이미지가 정리됐다."
            exit 1
          fi

      - name: 롤백 전 latest가 가리키던 대상 기록
        run: |
          echo "### 롤백 실행" >> "$GITHUB_STEP_SUMMARY"
          echo "- 대상 SHA: \`${{ inputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 사유: ${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 실행자: @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "롤백 직전 \`:latest\` 다이제스트:" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}' \
            >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "(조회 실패 — 무시하고 진행)" >> "$GITHUB_STEP_SUMMARY"

      - name: latest를 대상 SHA로 재태깅
        # 이미지를 내려받지 않고 레지스트리 안에서 매니페스트만 복사한다.
        run: |
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${{ inputs.sha }}"

      - name: Coolify 배포 트리거
        run: |
          curl -fSs -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

      - name: 롤백 확인 (smoke check)
        run: |
          BASE_URL="${{ vars.PROD_BASE_URL || 'https://api.mju-craft.shop' }}"
          echo "smoke target: ${BASE_URL}/api/projects"
          # deploy.yml과 동일한 검증. HTTP 200만 보면 안 된다 —
          # 프런트 도메인은 SPA fallback이 모든 경로에 200 HTML을 반환한다.
          ok=""
          for i in $(seq 1 20); do
            sleep 15
            body=$(curl -s --max-time 10 "${BASE_URL}/api/projects" || echo "")
            if echo "$body" | grep -q '"resultType":"SUCCESS"'; then
              echo "attempt ${i}/20: JSON OK"
              ok=1
              break
            fi
            echo "attempt ${i}/20: 아직 JSON 응답 아님"
          done
          if [ -z "$ok" ]; then
            echo "::error::롤백 후에도 운영 API가 5분 내 정상 JSON을 반환하지 않는다. docs/rollback.md의 '롤백이 실패하면' 절 참조."
            exit 1
          fi
          echo "롤백 완료 — 운영이 ${{ inputs.sha }} 이미지로 정상 응답 중"
