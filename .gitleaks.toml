# gitleaks 설정 — 기본 룰셋 확장
[extend]
useDefault = true

[allowlist]
description = "오탐 제외"
paths = [
  # 테스트 전용 더미 자격증명 (실제 시크릿 아님)
  '''src/test/resources/.*''',
  # pre-commit 훅 자체의 탐지 패턴 문자열
  '''\.githooks/.*''',
]
# Swagger @ExampleObject의 잘린 예시 JWT ("eyJ...." 로 끝나는 것만).
# 실제 토큰은 "..."로 끝나지 않으므로 진짜 유출은 계속 탐지된다.
regexTarget = "line"
regexes = [
  '''eyJ[A-Za-z0-9_-]+\.{3}''',
]

# JwtTokenProviderTest의 더미 JWT 키가 generic-api-key로 오탐된 커밋.
# 값은 base64("test-secret-for-jwt-token-provider-1")로 실제 자격증명이 아니다.
# 후속 커밋에서 리터럴을 런타임 생성으로 바꿨으나, gitleaks는 전체 이력을 스캔하고
# 절대 규칙 2(force push 금지)에 따라 이력을 다시 쓸 수 없어 이 커밋만 예외 처리한다.
commits = [
  "c190126df8d4ec21a40604bbe5594e0a2539f0e9",
]
